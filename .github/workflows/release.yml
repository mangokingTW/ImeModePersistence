name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (created at the current commit if it does not exist)"
        required: true

# Read-only at the top; the release job elevates to exactly what it needs, which
# is the minimal-permissions shape supply-chain review expects.
permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      # Create the release and upload assets.
      contents: write
      # Build provenance: attest signs a statement that these exact artifacts
      # came from this commit and this workflow run, checkable with
      # `gh attestation verify`. id-token mints the signing token; attestations
      # records the statement.
      id-token: write
      attestations: write

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Derive version
        shell: pwsh
        run: |
          # Inno Setup's VersionInfoVersion needs a bare numeric version, so the
          # leading "v" of the tag is stripped.
          $version = $env:TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag '$env:TAG' is not MAJOR.MINOR.PATCH like v1.2.3"
          }

          # CMakeLists.txt owns the version that gets stamped into the
          # executable. Publishing a tag that disagrees would ship a binary
          # whose reported version contradicts its release, so refuse instead.
          $declared = (Select-String -Path CMakeLists.txt `
            -Pattern 'project\(ImeModePersistence VERSION ([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          if ($declared -ne $version) {
            throw "Tag says $version but CMakeLists.txt declares $declared - bump one of them"
          }

          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build x64
        run: |
          cmake -S . -B build-x64 -A x64 "-DAPP_VERSION=$env:VERSION" -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DBUILD_TESTING=OFF
          cmake --build build-x64 --config Release

      - name: Build x86
        run: |
          cmake -S . -B build-x86 -A Win32 "-DAPP_VERSION=$env:VERSION" -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DBUILD_TESTING=OFF
          cmake --build build-x86 --config Release

      - name: Check the stamped version
        shell: pwsh
        run: |
          # Reads the version back out of what was actually built. A release that
          # ships a binary reporting the wrong version is worse than a failed one,
          # and only an end-to-end check catches the ways the number can go astray
          # between the tag and the resource.
          foreach ($arch in 'x64', 'x86') {
            $exe = "build-$arch/Release/ImeModePersistence.exe"
            $reported = (Get-Item $exe).VersionInfo.FileVersion
            Write-Output "$arch reports $reported"
            if ($reported -ne "$env:VERSION.0") {
              throw "$arch reports '$reported', expected '$env:VERSION.0'"
            }
          }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # Quoted for the same reason the cmake arguments are: PowerShell leaves
          # $env: unexpanded inside a bareword that starts with a single dash.
          #
          # Each call is checked individually: PowerShell only propagates the
          # LAST command's exit code, and v0.9.4 released without its admin
          # installer because the first compile failed behind a green step.
          iscc "/DAppVersion=$env:VERSION" installer\ImeModePersistence.iss
          if ($LASTEXITCODE -ne 0) { throw "admin installer failed to compile" }
          iscc "/DAppVersion=$env:VERSION" /DUserInstall installer\ImeModePersistence.iss
          if ($LASTEXITCODE -ne 0) { throw "user installer failed to compile" }

      - name: Package portable archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($arch in 'x64', 'x86') {
            Compress-Archive `
              -Path "build-$arch/Release/ImeModePersistence.exe", 'README.md', 'LICENSE' `
              -DestinationPath "dist/ImeModePersistence-$env:VERSION-$arch.zip"
          }

      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-FileHash dist/*.zip, dist/*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }

          # Written with LF, not the CRLF that Set-Content would produce: coreutils
          # sha256sum -c and BSD shasum -c read the carriage return as part of the
          # file name and fail to open it.
          $path = Join-Path $PWD 'dist/SHA256SUMS.txt'
          [System.IO.File]::WriteAllText($path, ($lines -join "`n") + "`n")

          Get-Content $path
          if ((Get-Content $path -Raw) -match "`r") { throw 'SHA256SUMS.txt contains CR' }

      - name: Attest build provenance
        id: attest
        # Signs a provenance statement for every published artifact, tying each
        # to this commit and workflow run. `gh attestation verify <file> --repo
        # mangokingTW/ImeModePersistence` then proves a download was built here
        # and not tampered with -- the impartial half of "not malicious" that a
        # weakness scanner cannot give.
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Attach provenance to the release
        shell: pwsh
        run: |
          # The attestation also lives in GitHub's attestations API, but that is
          # not visible to tools that inspect release assets -- OpenSSF Scorecard's
          # Signed-Releases check among them. Publishing the bundle under the name
          # SLSA tooling expects lets those verify the release without the API.
          Copy-Item "${{ steps.attest.outputs.bundle-path }}" dist/multiple.intoto.jsonl

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Belt to the braces above: name every artifact a release must carry
          # and refuse to publish a partial set. Whatever future failure slips
          # past a step's exit code, an incomplete release is the one outcome
          # this job must never produce.
          $expected = @(
            "ImeModePersistence-$env:VERSION-setup-admin.exe",
            "ImeModePersistence-$env:VERSION-setup-user.exe",
            "ImeModePersistence-$env:VERSION-x64.zip",
            "ImeModePersistence-$env:VERSION-x86.zip",
            'SHA256SUMS.txt'
          )
          $missing = $expected | Where-Object { -not (Test-Path "dist/$_") }
          if ($missing) { throw "release is missing: $($missing -join ', ')" }

          # --generate-notes derives the changelog from the commits since the
          # previous tag, so a release needs no hand-written body.
          $assets = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release create $env:TAG `
            --target $env:GITHUB_SHA `
            --title $env:TAG `
            --generate-notes `
            $assets
