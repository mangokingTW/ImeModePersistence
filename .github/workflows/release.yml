name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (created at the current commit if it does not exist)"
        required: true

# Read-only at the top; the release job elevates to exactly what it needs, which
# is the minimal-permissions shape supply-chain review expects.
permissions:
  contents: read

jobs:
  gate:
    name: Release Gate (Real-IME E2E & Recording)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: ./.github/actions/ime-recording

  # Same real-IME verification as `gate`, but on ARM64 and never blocking the
  # release: windows-11-arm is a public-preview hosted runner, so this stays
  # informational (continue-on-error, and deliberately absent from release's
  # `needs`) until that runner is out of preview. It runs alongside the
  # release for visibility, not as a gate.
  #
  # The steps live in a composite action shared with the on-demand
  # arm64-verify workflow, so a capture-script change can be tried on a real
  # ARM64 runner without cutting a release -- and what is tried there is
  # exactly what runs here.
  arm64-verify:
    name: ARM64 Real-IME E2E & Recording (non-blocking)
    runs-on: windows-11-arm
    continue-on-error: true
    # Bounded so a wedged preview runner cannot sit inside a release run for
    # the 360-minute default; a healthy run is about 21 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: ./.github/actions/arm64-verify

  release:
    needs: [gate]
    runs-on: windows-latest
    permissions:
      # Create the release and upload assets.
      contents: write
      # Build provenance: attest signs a statement that these exact artifacts
      # came from this commit and this workflow run, checkable with
      # `gh attestation verify`. id-token mints the signing token; attestations
      # records the statement.
      id-token: write
      attestations: write

    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Derive version
        shell: pwsh
        run: |
          # The tag may carry a pre-release suffix (v0.9.20-beta.1). The full
          # string names the release and its artifacts; the numeric part is what
          # the exe VERSIONINFO and Inno's VersionInfoVersion require.
          $full = $env:TAG -replace '^v', ''
          if ($full -notmatch '^\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$') {
            throw "Tag '$env:TAG' is not MAJOR.MINOR.PATCH, optionally -beta.N / -alpha.N / -rc.N"
          }
          $version = $full -replace '-.*$', ''
          $prerelease = if ($full -ne $version) { 'true' } else { 'false' }

          # CMakeLists.txt owns the numeric version stamped into the executable.
          # Publishing a tag that disagrees would ship a binary whose reported
          # version contradicts its release, so refuse instead.
          $declared = (Select-String -Path CMakeLists.txt `
            -Pattern 'project\(ImeModePersistence VERSION ([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          if ($declared -ne $version) {
            throw "Tag says $version but CMakeLists.txt declares $declared - bump one of them"
          }

          "VERSION=$version"       | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "FILEVER=$full"          | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PRERELEASE=$prerelease" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # When the tag's release already exists (a re-dispatch to retry the Store
      # submit), skip the whole build and reuse the published MSIX -- only the
      # Store step needs it.
      - name: Check for existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG *> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          "RELEASE_EXISTS=$($exists.ToString().ToLower())" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "release $env:TAG exists: $exists"

      - name: Build x64
        if: env.RELEASE_EXISTS != 'true'
        run: |
          cmake -S . -B build-x64 -A x64 "-DAPP_VERSION=$env:VERSION" -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DBUILD_TESTING=OFF
          cmake --build build-x64 --config Release

      - name: Build ARM64
        if: env.RELEASE_EXISTS != 'true'
        run: |
          cmake -S . -B build-arm64 -A ARM64 "-DAPP_VERSION=$env:VERSION" -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DBUILD_TESTING=OFF
          cmake --build build-arm64 --config Release

      - name: Check the stamped version
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          # Reads the version back out of what was actually built. A release that
          # ships a binary reporting the wrong version is worse than a failed one,
          # and only an end-to-end check catches the ways the number can go astray
          # between the tag and the resource.
          foreach ($arch in @('x64', 'arm64')) {
            $exe = "build-$arch/Release/ImeModePersistence.exe"
            $reported = (Get-Item $exe).VersionInfo.FileVersion
            Write-Output "$arch reports $reported"
            if ($reported -ne "$env:VERSION.0") {
              throw "$arch reports '$reported', expected '$env:VERSION.0'"
            }
          }

      - name: Build Store MSIX bundle (unsigned)
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          # The unsigned package to upload to Partner Center -- the Store signs it
          # on ingestion, so no code-signing cert is needed here. build.ps1 locates
          # makeappx in the Windows SDK on the runner. Named with the version so
          # the maintainer grabs it straight from the release for submission.
          #
          # One package per architecture, combined into a single .msixbundle: the
          # Store takes one package set per submission, and serves each device the
          # matching architecture from the same listing. The per-architecture .msix
          # files stage outside dist/ so only the bundle ships as a release asset.
          & packaging\msix\build.ps1 -Architecture x64 `
            -ExePath build-x64/Release/ImeModePersistence.exe `
            -OutDir msix-packages -OutName ImeModePersistence-x64.msix
          if ($LASTEXITCODE -ne 0) { throw "x64 MSIX packaging failed" }

          & packaging\msix\build.ps1 -Architecture arm64 `
            -ExePath build-arm64/Release/ImeModePersistence.exe `
            -OutDir msix-packages -OutName ImeModePersistence-arm64.msix
          if ($LASTEXITCODE -ne 0) { throw "ARM64 MSIX packaging failed" }

          & packaging\msix\bundle.ps1 `
            -Packages msix-packages/ImeModePersistence-x64.msix, msix-packages/ImeModePersistence-arm64.msix `
            -OutFile "dist/ImeModePersistence-$env:FILEVER.msixbundle"
          if ($LASTEXITCODE -ne 0) { throw "MSIX bundling failed" }

      - name: Build installer
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # Quoted for the same reason the cmake arguments are: PowerShell leaves
          # $env: unexpanded inside a bareword that starts with a single dash.
          iscc "/DAppVersion=$env:VERSION" "/DAppVersionFull=$env:FILEVER" installer\ImeModePersistence.iss
          if ($LASTEXITCODE -ne 0) { throw "installer failed to compile" }

      - name: Package portable archives
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # Published as win-x64 / win-arm64 (the .NET RID spelling, as
          # PowerShell's own releases use) rather than after the build
          # directory: GitHub sorts release assets by filename with no way to
          # override it, and bare "arm64" sorted above the installer. The build
          # directories keep their own names.
          foreach ($arch in @(
            @{ Build = 'x64';   Asset = 'win-x64' },
            @{ Build = 'arm64'; Asset = 'win-arm64' }
          )) {
            Compress-Archive `
              -Path "build-$($arch.Build)/Release/ImeModePersistence.exe", 'README.md', 'LICENSE' `
              -DestinationPath "dist/ImeModePersistence-$env:FILEVER-$($arch.Asset).zip"
          }

      - name: Checksums
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          $lines = Get-FileHash dist/*.zip, dist/*.exe, dist/*.msixbundle -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }

          # Written with LF, not the CRLF that Set-Content would produce: coreutils
          # sha256sum -c and BSD shasum -c read the carriage return as part of the
          # file name and fail to open it.
          $path = Join-Path $PWD 'dist/SHA256SUMS.txt'
          [System.IO.File]::WriteAllText($path, ($lines -join "`n") + "`n")

          Get-Content $path
          if ((Get-Content $path -Raw) -match "`r") { throw 'SHA256SUMS.txt contains CR' }

      - name: Attest build provenance
        id: attest
        if: env.RELEASE_EXISTS != 'true'
        # Signs a provenance statement for every published artifact, tying each
        # to this commit and workflow run. `gh attestation verify <file> --repo
        # mangokingTW/ImeModePersistence` then proves a download was built here
        # and not tampered with -- the impartial half of "not malicious" that a
        # weakness scanner cannot give.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
            dist/*.msixbundle
            dist/SHA256SUMS.txt

      - name: Attach provenance to the release
        if: env.RELEASE_EXISTS != 'true'
        shell: pwsh
        run: |
          # The attestation also lives in GitHub's attestations API, but that is
          # not visible to tools that inspect release assets -- OpenSSF Scorecard's
          # Signed-Releases check among them. Publishing the bundle under the name
          # SLSA tooling expects lets those verify the release without the API.
          Copy-Item "${{ steps.attest.outputs.bundle-path }}" dist/multiple.intoto.jsonl

      - name: Download MSIX bundle from the existing release
        if: env.RELEASE_EXISTS == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-dispatch retry: the build was skipped, so pull the already-published
          # bundle for the Store step to resubmit.
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          gh release download $env:TAG --pattern '*.msixbundle' --dir dist
          if ($LASTEXITCODE) { throw 'failed to download the release MSIX bundle' }

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Belt to the braces above: name every artifact a release must carry
          # and refuse to publish a partial set. Whatever future failure slips
          # past a step's exit code, an incomplete release is the one outcome
          # this job must never produce.
          # Only when building; a re-dispatch for an existing release skips the
          # build and downloads just the MSIX.
          if ($env:RELEASE_EXISTS -ne 'true') {
            $expected = @(
              "ImeModePersistence-$env:FILEVER-setup.exe",
              "ImeModePersistence-$env:FILEVER-win-x64.zip",
              "ImeModePersistence-$env:FILEVER-win-arm64.zip",
              "ImeModePersistence-$env:FILEVER.msixbundle",
              'SHA256SUMS.txt'
            )
            $missing = $expected | Where-Object { -not (Test-Path "dist/$_") }
            if ($missing) { throw "release is missing: $($missing -join ', ')" }
          }

          $assets = Get-ChildItem dist -File | ForEach-Object { $_.FullName }

          # Release notes: use this tag's section from CHANGELOG.md if present
          # (everything under "## <tag>" up to the next "## "), otherwise fall
          # back to notes auto-generated from the commits.
          $notesArgs = @('--generate-notes')
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "^##\s+$([regex]::Escape($env:TAG))(\s|$)") { $start = $i + 1; break }
            }
            if ($start -ge 0) {
              $body = New-Object System.Collections.Generic.List[string]
              for ($i = $start; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^##\s') { break }
                $body.Add($lines[$i])
              }
              $text = ($body -join "`n").Trim()
              if ($text) {
                # Store "What's new": the highlights only (no install/verify
                # footer, which would be wrong for a Store listing). The Store
                # step reads this file.
                [System.IO.File]::WriteAllText("$PWD/storenotes.md", $text + "`n")
                # Split into per-language notes at the "繁體中文" marker so each
                # Store listing gets its own language (en-us -> English,
                # zh-tw -> Chinese). storenotes.md stays as the bilingual
                # fallback (used when an app has a single listing).
                $parts = $text -split "(?m)^(?=繁體中文)", 2
                $enNotes = $parts[0].Trim()
                $zhNotes = if ($parts.Count -gt 1) { ($parts[1] -replace "^繁體中文[:：]\s*", "").Trim() } else { "" }
                if ($enNotes) { [System.IO.File]::WriteAllText("$PWD/storenotes.en.md", $enNotes + "`n") }
                if ($zhNotes) { [System.IO.File]::WriteAllText("$PWD/storenotes.zh.md", $zhNotes + "`n") }
                # Wrap the per-version highlights with a consistent install /
                # verify section, so every release reads as a finished note.
                # Built as an array (not a here-string) so every line stays
                # indented inside this YAML block scalar.
                $footer = @(
                  '',
                  '---',
                  '',
                  '### Install',
                  '[Microsoft Store](https://apps.microsoft.com/detail/9P05QQZ2P5XC) · `winget install mangokingTW.ImeModePersistence` — or the setup / portable zip below. Verify a download with `gh attestation verify <file> --repo mangokingTW/ImeModePersistence`.',
                  '',
                  'All builds (including Microsoft Store) support modern WinUI apps and elevated / anti-cheat targets via the optional Sidecar Helper in the tray menu.',
                  '安裝:微軟商店、上方任一套件管理器,或下方安裝檔／免安裝 zip。所有版本（含市集版）皆可透過托盤選單啟用 Sidecar Helper 支援 WinUI 與管理員／反作弊目標。'
                ) -join "`n"
                [System.IO.File]::WriteAllText("$PWD/relnotes.md", ($text + "`n" + $footer).Trim() + "`n")
                $notesArgs = @('--notes-file', "$PWD/relnotes.md")
              }
            }
          }

          # A pre-release tag (v0.9.20-beta.1) is published as a GitHub
          # pre-release, so it never becomes "Latest" and stable users are
          # unaffected; only someone who opens Releases gets the beta.
          $ghArgs = @($env:TAG, '--target', $env:GITHUB_SHA, '--title', $env:TAG) + $notesArgs
          if ($env:PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
          $ghArgs += $assets
          # Idempotent: create the release only if it doesn't already exist, so a
          # workflow_dispatch re-run for an existing tag reruns the build and the
          # Store submit without failing here. The storenotes files the Store step
          # reads are written above regardless of this.
          gh release view $env:TAG *> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($exists) {
            Write-Host "release $env:TAG already exists; skipping creation"
          } else {
            gh release create @ghArgs
            if ($LASTEXITCODE) { throw 'gh release create failed' }
          }

      # --- Microsoft Store auto-submit --------------------------------------
      # Stable releases only, and a no-op until the PARTNER_CENTER_* secrets are
      # set, so this stays dormant until Store publishing is configured. Runs
      # after the GitHub release so a Store hiccup never blocks the release.
      - name: Store submit gate
        if: env.PRERELEASE == 'false'
        shell: pwsh
        env:
          CLIENTID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
        run: |
          if ($env:CLIENTID) {
            "HAVE_STORE=true" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          } else {
            Write-Host 'PARTNER_CENTER_* secrets not set; skipping Store submission.'
          }

      - name: Set up Microsoft Store CLI
        if: env.HAVE_STORE == 'true'
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          # Pin the CLI rather than tracking 'latest'. v0.3.9 is the last
          # release whose blob upload works: v0.4.0 added --uploadTimeout with a
          # CustomParser but no DefaultValueFactory, and System.CommandLine only
          # runs a CustomParser when the option is actually on the command line.
          # Omit it and the value falls back to default(long) -- 0 -- which
          # becomes Retry.NetworkTimeout = TimeSpan.FromSeconds(0), cancelling
          # every request the instant it starts (microsoft/msstore-cli#162,
          # affects v0.4.0 and v0.4.1; v0.3.9 predates the option).
          #
          # It presents as a bare "Error while uploading the application
          # package." after a consistent ~25s, with no stack trace -- the real
          # exception only appears under --verbose, which also logs the
          # submission's SAS upload URL and so must never run in a public CI log.
          # v1.5.7 burned a release run on this.
          #
          # Fixed by microsoft/msstore-cli#163, merged 2026-08-25, but no release
          # carries it yet (v0.4.1 predates the merge). Move off v0.3.9 only once
          # a release later than v0.4.1 exists; there is nothing else in v0.4.x
          # this workflow needs, and passing --uploadTimeout explicitly to work
          # around #162 would just be carrying someone else's bug by hand.
          #
          # Two upstream bugs this workflow works around are still open, so the
          # workarounds in the submit step must stay whichever version is
          # pinned: #150 (`submission get` word-wraps JSON to the console width,
          # emitting invalid JSON) and #161 (success logs go to stderr).
          version: v0.3.9

      - name: Submit MSIX bundle to the Microsoft Store
        if: env.HAVE_STORE == 'true'
        shell: pwsh
        # msstore's commit has been seen to hang at "CommitStarted"
        # (microsoft/msstore-cli#29); bound it so a hang fails the step instead
        # of running out the job's default timeout.
        timeout-minutes: 45
        env:
          TENANT: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLERID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENTID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENTSECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          $storeId = '9P05QQZ2P5XC'
          # A .msixbundle carrying both x64 and ARM64. msstore-cli's `publish`
          # takes exactly one package path but accepts .msixbundle, so this is
          # how both architectures reach the one listing.
          $msix = "dist/ImeModePersistence-$env:FILEVER.msixbundle"
          # The Store re-signs the package on ingestion.
          msstore reconfigure --tenantId $env:TENANT --sellerId $env:SELLERID --clientId $env:CLIENTID --clientSecret $env:CLIENTSECRET
          if ($LASTEXITCODE) { throw 'msstore reconfigure failed' }

          # The Store allows only one in-flight submission, so cancel any left
          # pending by an earlier release -- this newer version supersedes it.
          # Best-effort: "no pending submission" is not an error, so the result
          # is intentionally ignored (and $LASTEXITCODE reset afterwards).
          # --no-confirm: msstore prompts y/n otherwise and dies in CI with
          # "Failed to read input in non-interactive mode".
          msstore submission delete $storeId --no-confirm
          $global:LASTEXITCODE = 0

          $notesFile = "$PWD/storenotes.md"
          if (Test-Path $notesFile) {
            # `msstore publish` clones the previous submission's release notes, so
            # to set this version's "What's new" we upload the package into a
            # draft WITHOUT committing (-nc), inject the notes, then commit.
            msstore publish $msix -id $storeId -nc
            if ($LASTEXITCODE) { throw 'msstore publish (-nc) failed' }

            # Best-effort: set the notes on every listing. Any failure here just
            # means the package ships with the previous notes -- it must never
            # block the commit below, so it is wrapped and the exit code reset.
            try {
              # msstore prints the JSON via AnsiConsole, which hard-wraps to
              # ~80 cols in CI and splits \uXXXX escapes (breaks non-ASCII
              # notes). Rejoin the physical lines so the escapes are whole.
              $raw = ((msstore submission get $storeId) -join '')
              $s = $raw.IndexOf('{'); $e = $raw.LastIndexOf('}')
              if ($s -ge 0 -and $e -gt $s) {
                # Round-trip the whole submission -- update is a full replace, so
                # only releaseNotes changes and the uploaded package is preserved.
                $obj = $raw.Substring($s, $e - $s + 1) | ConvertFrom-Json
                $read1500 = { param($f) $t = (Get-Content $f -Raw).Trim(); if ($t.Length -gt 1500) { $t.Substring(0, 1500) } else { $t } }
                $enFile = "$PWD/storenotes.en.md"; $zhFile = "$PWD/storenotes.zh.md"
                $listed = @($obj.listings.PSObject.Properties | Where-Object { $_.Value.baseListing })
                foreach ($p in $listed) {
                  # Release notes per language
                  $f = if ($listed.Count -gt 1 -and ($p.Name -like '*tw*' -or $p.Name -like '*hant*')) {
                    if (Test-Path $zhFile) { $zhFile } else { $notesFile }
                  } elseif ($listed.Count -gt 1 -and (Test-Path $enFile)) {
                    $enFile
                  } else {
                    $notesFile
                  }
                  $p.Value.baseListing.releaseNotes = (& $read1500 $f)

                  # 5-language trailers (video preview)
                  $trailerTitle = if ($p.Name -like '*tw*' -or $p.Name -like '*hant*') {
                    '即時輸入法模式維持與游標指示器動態演示'
                  } elseif ($p.Name -like '*cn*' -or $p.Name -like '*hans*') {
                    '实时输入法模式保持与光标指示器动态演示'
                  } elseif ($p.Name -like '*ja*' -or $p.Name -like '*jp*') {
                    'アプリごとのIME入力モード維持＆カーソルインジケーター実演'
                  } elseif ($p.Name -like '*ko*' -or $p.Name -like '*kr*') {
                    '앱별 IME 입력 모드 유지 및 커서 표시기 실시간 시연'
                  } else {
                    'Per-App IME Mode Persistence & Live Caret Indicator Demo'
                  }

                  $trailerObj = @(
                    @{
                      videoFileName = 'store-preview.mp4'
                      imageFileName = 'store-preview-thumb.png'
                      title         = $trailerTitle
                    }
                  )
                  if ($p.Value.baseListing.PSObject.Properties['trailers']) {
                    $p.Value.baseListing.trailers = $trailerObj
                  } else {
                    $p.Value.baseListing | Add-Member -MemberType NoteProperty -Name 'trailers' -Value $trailerObj
                  }
                }
                msstore submission update $storeId ($obj | ConvertTo-Json -Depth 100)
              } else {
                Write-Host 'could not parse submission JSON; keeping previous notes'
              }
            } catch { Write-Host "release-notes and trailers update skipped: $_" }
            $global:LASTEXITCODE = 0

            msstore submission publish $storeId
            if ($LASTEXITCODE) { throw 'msstore submission publish (commit) failed' }

            # `submission publish` returns at CommitStarted -- the commit is still
            # processing, so Partner Center doesn't yet show the submission as
            # submitted. Wait until it leaves CommitStarted (the commit finished).
            # Bounded, since certification itself takes far longer; `msstore
            # submission poll` would block for full publication.
            $done = $false
            for ($i = 0; $i -lt 50; $i++) {
              Start-Sleep -Seconds 30
              # msstore prints the status line to stderr via Spectre.Console, so
              # 2>&1 is required -- without it the capture is empty and this loop
              # never detects completion (it just idles the full window).
              $status = ((msstore submission status $storeId 2>&1) -join ' ')
              $global:LASTEXITCODE = 0
              Write-Host "poll ${i}: $status"
              if ($status -match 'CommitFailed|CertificationFailed|PreProcessingFailed|PublishFailed|ReleaseFailed') {
                throw "submission failed: $status"
              }
              # Once it has left CommitStarted / PendingCommit the commit is done
              # (now certifying / releasing / published) -- stop here.
              if ($status -match 'Submission Status' -and $status -notmatch 'CommitStarted|PendingCommit') {
                $done = $true
                break
              }
            }
            if (-not $done) {
              Write-Host 'still processing after the wait; the submission is in progress server-side'
            }
          } else {
            # No curated notes for this tag: package-only publish (commits).
            msstore publish $msix -id $storeId
            if ($LASTEXITCODE) { throw 'msstore publish failed' }
          }
