name: Wiki to Pages sync

# The wiki is the source of truth; this mirrors it into docs/wiki/ (styled Pages
# with per-page social previews). Runs when the wiki is edited (gollum) or on
# demand. main is protected, so it opens/updates a PR rather than pushing to main.
on:
  gollum:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wiki-pages-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Clone the wiki
        run: git clone --depth 1 "https://github.com/${{ github.repository }}.wiki.git" wiki-src

      - name: Render wiki -> docs/wiki
        run: |
          cd tools/wiki-pages
          npm ci
          WIKI_DIR="$GITHUB_WORKSPACE/wiki-src" OUT_DIR="$GITHUB_WORKSPACE/docs/wiki" node build.mjs

      - name: Open a PR if the mirror changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/wiki; then
            echo "No changes in the wiki mirror."
            exit 0
          fi
          branch="chore/wiki-pages-sync"
          git config user.name "mangokingTW"
          git config user.email "mangokingTW@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/wiki
          git commit -m "docs(site): sync wiki -> Pages mirror

          Auto-generated by wiki-pages-sync from a wiki edit.

          Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>"
          git push -f origin "$branch"
          if ! gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr create --base main --head "$branch" \
              --title "docs(site): sync wiki -> Pages mirror" \
              --body "Regenerated \`docs/wiki/\` from the latest wiki. Auto-opened by the wiki-pages-sync workflow."
          fi
