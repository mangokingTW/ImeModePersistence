name: ARM64 Verify

# ARM64 verification on a windows-11-arm runner, running the same composite
# action release.yml does -- so what passes here is what runs there.
#
# Triggered on pull requests that touch the capture harness, and on demand for
# anything else. Path-limited rather than run on every pull request because the
# runner appears to take one job at a time and a full run is about 25 minutes;
# every failure this has caught so far was in the capture script, and a change
# under src/ is covered by release.yml's own ARM job.
#
# Note that `pull_request: paths` matches the pull request's cumulative diff
# against the base, not just the newest push -- so once a branch touches these
# files, every later push re-triggers this. cancel-in-progress is what keeps
# that from costing anything.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/ui/**"
      - ".github/actions/arm64-verify/**"
      - ".github/workflows/arm64-verify.yml"

# Per ref, not global: a shared group would let a pull request cancel a
# release's own ARM job, which is the one run that actually matters.
concurrency:
  group: arm64-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arm64-verify:
    name: ARM64 Real-IME E2E & Recording
    runs-on: windows-11-arm
    # A wedged windows-11-arm runner would otherwise hold this slot for the
    # 360-minute default. One did: it sat on the same step for an hour, ignored
    # a cancel request for five minutes, and uploaded no logs at all -- not
    # even for the checkout that had already succeeded. The runner appears to
    # take one job at a time, so that is six hours of no ARM verification for
    # anyone. A healthy run is 25-40 minutes; the spread is DISM, whose zh-TW
    # install has taken anywhere from 4 to 26 minutes on this runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: ./.github/actions/arm64-verify
