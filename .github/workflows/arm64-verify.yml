name: ARM64 Verify (on-demand)

# On-demand ARM64 verification, so a change to the capture script can be tested
# on a windows-11-arm runner without cutting a release. release.yml runs the
# same composite action, so what passes here is what runs there.
#
# Dispatch-only on purpose: windows-11-arm is a public-preview runner and
# appears to allow only one job at a time, so running this on every pull
# request would queue behind (or cancel) a release's own ARM job.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-verify:
    name: ARM64 Real-IME E2E & Recording
    runs-on: windows-11-arm
    # A wedged windows-11-arm runner would otherwise hold this slot for the
    # 360-minute default. One did: it stopped reporting 4s in, ignored a cancel
    # for five minutes, and uploaded no logs at all -- not even for the steps
    # that had already succeeded. The runner appears to take one job at a time,
    # so that is six hours of no ARM verification for anyone. A healthy run is
    # about 21 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: ./.github/actions/arm64-verify
