name: MSVC analysis

# The Microsoft compiler's own static analyzer, complementary to CodeQL: one is
# broad on general weakness patterns, the other knows the Win32 API this program
# lives on (handle misuse, wrong-sized structures, ignored return codes). Its
# SARIF goes to the same Security tab.
on:
  # Skip on non-code changes. MSVC analysis inspects C++, so docs/assets/installer
  # PRs gain nothing from it. CodeQL is deliberately left running on every PR so
  # the Scorecard SAST check keeps counting it.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'assets/**'
      - 'installer/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'assets/**'
      - 'installer/**'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: windows-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=OFF

      - name: Run MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@24c285ab36952c9e9182f4b78dfafbac38a7e5ee # v0.1.1
        id: run-analysis
        with:
          cmakeBuildDirectory: ${{ github.workspace }}/build
          buildConfiguration: Release
          ruleset: NativeRecommendedRules.ruleset

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: ${{ steps.run-analysis.outputs.sarif }}
