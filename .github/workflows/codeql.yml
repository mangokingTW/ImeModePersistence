name: CodeQL

# GitHub's own static analysis, run on the actual build. Results land in the
# repository's Security tab, so anyone can read an impartial weakness report
# rather than take the author's word for it. It finds security *weaknesses*
# (overruns, uninitialised reads) -- not malice, which the sandbox scanners and
# build provenance cover.
on:
  push:
    branches: [main]
    # On main, only when compiled code changes -- CodeQL builds C/C++ under its
    # tracer, which is slow, and a doc-only merge to main gains nothing. PRs run
    # it unconditionally (below), which is what the score actually depends on.
    paths:
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.hpp"
      - "**/*.c"
      - "**/*.rc"
      - "**/*.rc.in"
      - "CMakeLists.txt"
      - ".github/workflows/codeql.yml"
  pull_request:
    # Every PR, docs and packaging included: Scorecard's SAST check credits a
    # project only when its recent PRs ran a static analyser, so a doc-only PR
    # that skipped CodeQL drags the score down. The extra build time is the cost
    # of keeping SAST at full marks.
  schedule:
    # Weekly, so new queries reach old code without a push.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: windows-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 1


      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: c-cpp
          # Manual, because C/C++ has to be built under CodeQL's tracer; the
          # build below is the one whose output ships.
          build-mode: manual

      - name: Build
        run: |
          # Use multi-processor compilation (/MP, --parallel) to minimize CodeQL tracer overhead
          cmake -S . -B build -A x64 -DBUILD_TESTING=OFF -DCMAKE_CXX_FLAGS="/MP"
          cmake --build build --config Debug --target ImeModePersistence --parallel

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:c-cpp"
          threads: 0
          ram: 6144
