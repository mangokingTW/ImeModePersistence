name: IME Recording

# On-demand: builds the app, opens two real Win32 windows on the GitHub Actions
# interactive desktop, drives IME mode changes with ImmSetConversionStatus, and
# captures a continuous 10 FPS real-time desktop video of the live typing and taskbar transitions.
#
# The result is a smooth animated GIF (ime-recording.gif) plus four individual PNG
# key frames uploaded as the "ime-recording" artifact.
#
# Triggered manually from the Actions tab ("Run workflow").
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ime-recording:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Build x64
        run: |
          cmake -S . -B build-x64 -A x64 -DBUILD_TESTING=OFF
          cmake --build build-x64 --config Release

      - name: Install Traditional Chinese (zh-TW) IME
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cacheDir = "C:\ime-cache"
          if (-not (Test-Path $cacheDir)) { New-Item -ItemType Directory -Path $cacheDir -Force }

          # Try downloading pre-cached assets from Draft Release 'ci-dependencies' (2-second download)
          $downloadSuccess = $false
          try {
            Write-Host "Checking for offline IME assets in hidden Draft Release 'ci-dependencies'..."
            gh release download ci-dependencies --repo ${{ github.repository }} --pattern "zh-tw-ime-assets.zip" --dir $cacheDir
            $zip = "$cacheDir\zh-tw-ime-assets.zip"
            if (Test-Path $zip) {
              Write-Host "Found cached IME package! Restoring offline in ~5 seconds..."
              Expand-Archive -Path $zip -DestinationPath "C:\Windows\System32\IME\IMETC" -Force
              $downloadSuccess = $true
            }
          } catch {
            Write-Host "Draft Release not populated yet. Falling back to Windows Update..."
          }

          if (-not $downloadSuccess) {
            Write-Host "Running first-time Install-Language from Windows Update (with live progress tracking)..."
            $job = Start-Job -ScriptBlock {
              Install-Language -Language zh-TW -CopyToSettings -ErrorAction Stop
            }
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            while ($job.State -eq 'Running') {
              $sec = [math]::Round($sw.Elapsed.TotalSeconds)
              $downDir = "C:\Windows\SoftwareDistribution\Download"
              $mb = 0
              if (Test-Path $downDir) {
                $mb = [math]::Round((Get-ChildItem $downDir -Recurse -File -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum / 1MB, 1)
              }
              Write-Host "[+$($sec)s] Installing Traditional Chinese (zh-TW)... Downloaded: ${mb} MB"
              Start-Sleep -Seconds 15
            }
            Receive-Job $job -Wait -AutoRemoveJob
            Write-Host "Installation completed in $([math]::Round($sw.Elapsed.TotalSeconds)) seconds."


            # Automatically package installed IME assets & create Draft Release
            try {
              Write-Host "Creating Draft Release 'ci-dependencies' for future ultra-fast offline runs..."
              $zipPath = "$cacheDir\zh-tw-ime-assets.zip"
              Compress-Archive -Path "C:\Windows\System32\IME\IMETC" -DestinationPath $zipPath -Force
              gh release create ci-dependencies $zipPath --draft --title "CI Dependencies" --notes "Pre-cached IME components for fast CI offline installation" --repo ${{ github.repository }}
              Write-Host "Successfully created hidden Draft Release 'ci-dependencies'!"
            } catch {
              Write-Host "Draft Release auto-creation note: $_"
            }
          }

          $list = Get-WinUserLanguageList
          if (-not ($list | Where-Object { $_.LanguageTag -like 'zh*' })) {
            $lang = [Microsoft.InternationalSettings.Commands.WinUserLanguage]::new('zh-TW')
            $list.Insert(0, $lang)
            Set-WinUserLanguageList $list -Force
          }
          $tips = (Get-WinUserLanguageList | Where-Object { $_.LanguageTag -like 'zh*' }).InputMethodTips
          Write-Host "zh-TW InputMethodTips: $tips"

      - name: Install dependencies
        run: pip install pytest==8.3.4 pywinauto==0.6.9 pillow==10.4.0

      - name: Capture continuous IME persistence recording
        run: >
          python tests/ui/capture_ime_recording.py
          "build-x64/Release/ImeModePersistence.exe"
          ime-recording

      - name: Run real-IME E2E tests
        run: python -m pytest tests/ui/test_ime_persistence_e2e.py -v --tb=short

      - name: Upload recording artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ime-recording
          path: |
            ime-recording/ime-recording.gif
            ime-recording/ime-frame-*.png
          if-no-files-found: warn
