name: IME Recording

# On-demand: builds the app, opens two real Win32 windows on the GitHub Actions
# interactive desktop, drives IME mode changes with ImmSetConversionStatus, and
# captures a continuous 10 FPS real-time desktop video of the live typing and taskbar transitions.
#
# The result is a smooth animated GIF (ime-recording.gif) plus four individual PNG
# key frames uploaded as the "ime-recording" artifact.
#
# Triggered manually from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/ui/**'
      - '.github/workflows/ime-recording.yml'


permissions:
  contents: read

jobs:
  ime-recording:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Build x64
        run: |
          cmake -S . -B build-x64 -A x64 -DBUILD_TESTING=OFF
          cmake --build build-x64 --config Release

      - name: Install Traditional Chinese (zh-TW) IME
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "Running genuine official Install-Language for full TSF IME COM registration..."
          Install-Language -Language zh-TW -CopyToSettings -ErrorAction Stop

          $list = Get-WinUserLanguageList
          $zh = $list | Where-Object { $_.LanguageTag -like 'zh*' }
          if ($zh) {
            $list.Remove($zh)
            $list.Insert(0, $zh)
            Set-WinUserLanguageList $list -Force
          }
          $tips = (Get-WinUserLanguageList | Where-Object { $_.LanguageTag -like 'zh*' }).InputMethodTips
          Write-Host "Active zh-TW InputMethodTips: $tips"





      - name: Install dependencies
        run: pip install pytest==8.3.4 pywinauto==0.6.9 pillow==10.4.0 imageio==2.35.1 imageio-ffmpeg==0.5.1 pyautogui==0.9.54 pydirectinput==1.0.4

      - name: Capture continuous IME persistence recording
        run: >
          python tests/ui/capture_ime_recording.py
          "build-x64/Release/ImeModePersistence.exe"
          ime-recording

      - name: Run real-IME E2E tests
        run: python -m pytest tests/ui/test_ime_persistence_e2e.py -v --tb=short

      - name: Upload recording artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ime-recording
          path: ime-recording/ime-recording.mp4
          if-no-files-found: warn

