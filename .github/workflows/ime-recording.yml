name: IME Recording

# On-demand: builds the app, opens two real Win32 windows on the GitHub Actions
# interactive desktop, drives IME mode changes with ImmSetConversionStatus, and
# captures full-desktop screenshots (including the Windows taskbar IME indicator)
# for each step of the cross-window persistence flow.
#
# The result is an animated GIF (ime-recording.gif) plus four individual PNG
# frames uploaded as the "ime-recording" artifact.  Download it from the Actions
# tab after the run to see the real IME indicator (中 / A) react to window
# focus switches on a genuine Windows runner.
#
# Triggered manually from the Actions tab ("Run workflow").
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ime-recording:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Build x64
        run: |
          cmake -S . -B build-x64 -A x64 -DBUILD_TESTING=OFF
          cmake --build build-x64 --config Release

      - name: Configure Traditional Chinese (zh-TW) IME
        shell: pwsh
        run: |
          # Instant Language & InputMethodTip configuration (0-second setup, no Windows Update download needed)
          $list = Get-WinUserLanguageList
          if (-not ($list | Where-Object { $_.LanguageTag -like 'zh*' })) {
            $lang = [Microsoft.InternationalSettings.Commands.WinUserLanguage]::new('zh-TW')
            $lang.InputMethodTips.Clear()
            $lang.InputMethodTips.Add('0404:{B115690A-EA02-48D5-A231-E3578D2FDF80}{B2F9C502-1742-11D4-9790-0080C882687E}')
            $list.Insert(0, $lang)
            Set-WinUserLanguageList $list -Force
          }
          $tips = (Get-WinUserLanguageList | Where-Object { $_.LanguageTag -like 'zh*' }).InputMethodTips
          Write-Host "zh-TW InputMethodTips configured: $tips"

      - name: Install dependencies
        run: pip install pytest==8.3.4 pywinauto==0.6.9 pillow==10.4.0

      - name: Capture IME persistence recording
        run: >
          python tests/ui/capture_ime_recording.py
          "build-x64/Release/ImeModePersistence.exe"
          ime-recording

      - name: Run real-IME E2E tests
        run: python -m pytest tests/ui/test_ime_persistence_e2e.py -v --tb=short


      - name: Upload recording artifact

        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ime-recording
          path: |
            ime-recording/ime-recording.gif
            ime-recording/ime-frame-*.png
          if-no-files-found: warn
