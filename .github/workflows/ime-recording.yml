name: IME Recording (Release Gate)

# Release Gate & On-demand verification: builds the app, installs official zh-TW IME,
# and captures 60 FPS real-time desktop video verifying live typing, caret indicator, and taskbar transitions.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ime-recording:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: ./.github/actions/ime-recording
      - name: Upload recording artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ime-recording
          path: ime-recording/ime-recording.mp4
          if-no-files-found: warn
