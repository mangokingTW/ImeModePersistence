name: IME Recording

# On-demand / PR: builds the app, installs zh-TW IME via fast DISM/CAB cache,
# and captures 60 FPS real-time desktop video of live typing and taskbar transitions.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/ui/**'
      - '.github/workflows/ime-recording.yml'

permissions:
  contents: read

jobs:
  ime-recording:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Build x64
        run: |
          cmake -S . -B build-x64 -A x64 -DBUILD_TESTING=OFF
          cmake --build build-x64 --config Release

      - name: Cache Official IME CAB Package
        id: cache-ime-cab
        uses: actions/cache@v4
        with:
          path: C:\ime-cab-cache
          key: ime-cab-zh-tw-server2025-v1

      - name: Install Traditional Chinese IME via Offline DISM Package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $cabDir = "C:\ime-cab-cache"
          if (-not (Test-Path $cabDir)) { New-Item -ItemType Directory -Path $cabDir -Force }

          # Try instant download from Release storage (1 second download inside GitHub DC)
          try {
            gh release download ci-dependencies --pattern "*.cab" -D $cabDir --repo ${{ github.repository }} --clobber
          } catch {}

          $cachedCabs = Get-ChildItem -Path $cabDir -Filter "*.cab" -ErrorAction SilentlyContinue

          if ($cachedCabs.Count -gt 0) {
            Write-Host "⚡ Installing official zh-TW IME packages offline via DISM (~5 seconds)..."
            foreach ($cab in $cachedCabs) {
              Write-Host "Installing $($cab.FullName) ($([math]::Round($cab.Length/1MB, 2)) MB)..."
              dism /online /add-package /packagepath:$($cab.FullName) /quiet /norestart
            }
          } else {
            Write-Host "No cached CAB found in Release. Starting real-time background CAB capturer..."
            $capturer = Start-Job -ScriptBlock {
              param($dest)
              for ($i = 0; $i -lt 1800; $i++) {
                $cabs = Get-ChildItem -Path "C:\Windows\SoftwareDistribution\Download", "C:\Windows\Temp", "$env:TEMP" -Recurse -Filter "*.cab" -ErrorAction SilentlyContinue
                foreach ($c in $cabs) {
                  if ($c.Length -gt 5MB) {
                    Copy-Item $c.FullName -Destination "$dest\$($c.Name)" -Force -ErrorAction SilentlyContinue
                  }
                }
                Start-Sleep -Seconds 1
              }
            } -ArgumentList $cabDir

            Write-Host "Adding capability from Windows Update..."
            dism /online /add-capability /capabilityname:Language.Basic~~~zh-TW~0.0.1.0

            Stop-Job $capturer -ErrorAction SilentlyContinue
            Remove-Job $capturer -ErrorAction SilentlyContinue

            # Upload captured official CAB to Release ci-dependencies for permanent 5s runs
            $capturedCabs = Get-ChildItem -Path $cabDir -Filter "*.cab" -ErrorAction SilentlyContinue
            Write-Host "Captured $($capturedCabs.Count) official CAB package(s)!"
            foreach ($cab in $capturedCabs) {
              Write-Host "Uploading official $($cab.Name) ($([math]::Round($cab.Length/1MB, 2)) MB) to Release 'ci-dependencies'..."
              try {
                gh release upload ci-dependencies $cab.FullName --clobber --repo ${{ github.repository }}
              } catch {
                Write-Host "Release upload note: $_"
              }
            }
          }



          $list = New-WinUserLanguageList "zh-TW"
          Set-WinUserLanguageList $list -Force
          $tips = (Get-WinUserLanguageList).InputMethodTips
          Write-Host "Active zh-TW InputMethodTips: $tips"

          New-Item -Path "HKCU:\Software\Microsoft\IME\15.0\IMETC" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\IME\15.0\IMETC" -Name "DefaultMode" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue

      - name: Install dependencies
        run: pip install pytest==8.3.4 pywinauto==0.6.9 pillow==10.4.0 imageio-ffmpeg==0.5.1 pydirectinput==1.0.4

      - name: Capture continuous IME persistence recording
        env:
          PYTHONIOENCODING: utf-8
        run: >
          python tests/ui/capture_ime_recording.py
          "build-x64/Release/ImeModePersistence.exe"
          ime-recording

      - name: Run real-IME E2E tests
        run: python -m pytest tests/ui/test_ime_persistence_e2e.py -v --tb=short

      - name: Upload recording artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ime-recording
          path: ime-recording/ime-recording.mp4
          if-no-files-found: warn


