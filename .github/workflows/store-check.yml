name: Store credentials check

# Manual dry-run that verifies the PARTNER_CENTER_* secrets, the Entra app, and
# its Manager role are wired correctly -- it lists the account's apps but submits
# nothing. Run it from the Actions tab (or `gh workflow run store-check.yml`).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2 # v1.1

      - name: Verify Store access
        shell: pwsh
        env:
          TENANT: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLERID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENTID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENTSECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          if (-not $env:CLIENTID) { throw 'PARTNER_CENTER_* secrets are not set' }
          msstore reconfigure --tenantId $env:TENANT --sellerId $env:SELLERID --clientId $env:CLIENTID --clientSecret $env:CLIENTSECRET
          if ($LASTEXITCODE) { throw 'msstore reconfigure failed - check tenant/client/secret/seller' }
          msstore apps list
          if ($LASTEXITCODE) { throw 'msstore apps list failed - check the app has the Manager (Windows) role' }
