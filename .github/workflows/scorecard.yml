name: Scorecard

# OpenSSF Scorecard grades the project's security posture -- branch protection,
# pinned actions, whether releases carry provenance, leaked-secret checks -- and
# publishes the result. An impartial third party reporting on how the repository
# is run, not on the code itself.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "18 5 * * 2"
  # Manual refresh: the score is otherwise only re-evaluated on a push to main or
  # the weekly cron, so a release (a tag push) does not update Signed-Releases on
  # its own.
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the result to the Security tab, and publish it to the public
      # Scorecard API that backs the README badge.
      security-events: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: results.sarif
