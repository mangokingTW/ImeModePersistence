name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; neither job writes anything back to the repository, and
# an unnecessarily broad GITHUB_TOKEN is what supply-chain review flags first.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            platform: x64
          - name: x86
            platform: Win32

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.platform }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        shell: pwsh
        working-directory: build
        run: |
          # --output-on-failure because the harness prints the failing expression
          # and its file and line, which is the whole diagnostic. --no-tests=error
          # so a test binary that failed to register anything is a failure rather
          # than a silent pass.
          #
          # A suite whose environment cannot support it exits 77 and CTest counts
          # it as skipped rather than passed, listing it under "did not run" in the
          # summary. That is the honest result for a headless runner that cannot
          # create a window or change a keyboard layout -- and it is worth reading,
          # because a suite that quietly stops testing anything looks identical to
          # one that passes.
          ctest --build-config Release --output-on-failure --no-tests=error

      - name: Check the Chinese strings survived compilation
        shell: pwsh
        run: |
          # Source files are UTF-8 without a BOM. If /utf-8 is ever dropped, MSVC
          # reads them in the system ANSI code page and every Chinese literal
          # becomes mojibake -- with no warning, because those bytes are nearly
          # all valid CP1252. Nothing else in CI notices, so look in the binary
          # for the UTF-16LE bytes the menu item is supposed to have.
          #
          # Hex rather than the characters themselves, so this check cannot be
          # broken by the encoding of the workflow file.
          $needle = '0b7a0f5f817d9a5b388f65519e8a008a'
          $bytes = [IO.File]::ReadAllBytes("$PWD/build/Release/ImeModePersistence.exe")
          $hex = [BitConverter]::ToString($bytes).Replace('-', '').ToLower()

          if (-not $hex.Contains($needle)) {
            throw 'Chinese menu string is not in the binary as UTF-16LE. Check that /utf-8 is still passed to MSVC.'
          }
          Write-Output 'Chinese strings present as UTF-16LE'

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ImeModePersistence-${{ matrix.name }}
          path: build/Release/ImeModePersistence.exe
          if-no-files-found: error

  # Compiling the Inno Setup script on every change is the only way to catch a
  # broken installer before a release tag depends on it.
  installer:
    runs-on: windows-latest
    name: installer
    # The executables this packages were just built by the matrix job, so take
    # those instead of compiling both architectures a second time -- the .iss
    # reads them from the paths the download steps recreate.
    needs: build

    steps:
      - uses: actions/checkout@v5

      - name: Fetch the x64 executable
        uses: actions/download-artifact@v8
        with:
          name: ImeModePersistence-x64
          path: build-x64/Release

      - name: Fetch the x86 executable
        uses: actions/download-artifact@v8
        with:
          name: ImeModePersistence-x86
          path: build-x86/Release

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # Both variants: one source, compiled twice. A syntax error inside a
          # /DUserInstall branch is invisible unless that branch is compiled.
          #
          # Each call is checked individually. PowerShell steps only propagate
          # the LAST command's exit code, so a failure in the first compile was
          # masked by the second succeeding -- which is how a broken admin
          # installer passed CI and v0.9.4 released without one.
          iscc /DAppVersion=0.0.0 installer\ImeModePersistence.iss
          if ($LASTEXITCODE -ne 0) { throw "admin installer failed to compile" }
          iscc /DAppVersion=0.0.0 /DUserInstall installer\ImeModePersistence.iss
          if ($LASTEXITCODE -ne 0) { throw "user installer failed to compile" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ImeModePersistence-setup
          path: dist/*.exe
          if-no-files-found: error
