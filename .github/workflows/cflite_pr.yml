name: ClusterFuzzLite

# Runs the presets-parser fuzz target on the code a PR changes, catching a crash
# or hang before it merges. This is also what OpenSSF Scorecard recognises as
# fuzzing, unlike a bespoke libFuzzer workflow.
on:
  # Skip on changes that cannot affect the parser -- docs, assets, the installer
  # script. The required build checks still run; only this ~3-minute fuzz job is
  # skipped. Fuzzing's Scorecard credit is for having a setup, not per-run, so
  # this costs no score.
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'assets/**'
      - 'installer/**'

permissions: read-all

jobs:
  fuzzing:
    runs-on: ubuntu-latest
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c++
          sanitizer: address

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 120
          mode: code-change
          sanitizer: address
