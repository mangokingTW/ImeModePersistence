version: 2
updates:
  # Keep the GitHub Actions the workflows depend on current, so a pinned action
  # that gains a security fix is surfaced as a PR rather than drifting. The only
  # dependency ecosystem this project has: the app itself links nothing but the
  # Windows SDK.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # The fuzzing base image is pinned by digest in .clusterfuzzlite/Dockerfile.
  # This keeps that digest current: Dependabot bumps it when OSS-Fuzz publishes a
  # new base-builder, so the pin stays reproducible without going stale.
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
