name: ARM64 Real-IME Verification
description: >-
  Builds ARM64, installs the real zh-TW IME, and captures the 60 FPS recording
  and E2E suite on a windows-11-arm runner. Shared so release.yml and the
  on-demand arm64-verify workflow run byte-identical steps -- the ARM path is
  the one that cannot be reproduced locally, so it must not drift between the
  place it is tested and the place it actually runs.

runs:
  using: composite
  steps:
    - name: Dismiss the Shell_OOBEProxy onboarding screen(s)
      shell: pwsh
      run: |
        # windows-11-arm's interactive session can show Windows' first-sign-in
        # "Choose privacy settings for your device" screen (class
        # Shell_OOBEProxy, rendered as embedded web content) which sits in the
        # foreground and swallows input meant for real apps. Its "move on"
        # button's accessible name is a full phrase ("Next, tab through all
        # privacy settings to continue"), not "Next" -- exact-name matching
        # never finds it, and neither does a top-down descendant search from
        # the window (a UIA traversal quirk with this content); this script
        # finds it via AutomationElement.FocusedElement instead.
        .\tests\ui\dismiss_onboarding_screens.ps1 -TimeoutSeconds 90

    - name: Build ARM64
      shell: pwsh
      run: |
        cmake -S . -B build-arm64 -A ARM64 -DBUILD_TESTING=OFF
        cmake --build build-arm64 --config Release

    - name: Confirm the binary is actually ARM64
      shell: pwsh
      run: |
        $exe = "build-arm64/Release/ImeModePersistence.exe"
        $bytes = [System.IO.File]::ReadAllBytes($exe)
        $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
        $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
        # 0x8664 = x64, 0xAA64 = ARM64
        Write-Host ("Machine field: 0x{0:X4}" -f $machine)
        if ($machine -ne 0xAA64) { throw "Not an ARM64 PE image (got 0x$($machine.ToString('X4')))" }

    - name: Install Traditional Chinese (zh-TW) IME
      shell: pwsh
      run: |
        $ProgressPreference = 'SilentlyContinue'
        Write-Host "Installing Traditional Chinese (zh-TW) IME via DISM..."
        dism /online /add-capability /capabilityname:Language.Basic~~~zh-TW~0.0.1.0

        $list = New-WinUserLanguageList "zh-TW"
        Set-WinUserLanguageList $list -Force
        $tips = (Get-WinUserLanguageList).InputMethodTips
        Write-Host "Active zh-TW InputMethodTips: $tips"

        New-Item -Path "HKCU:\Software\Microsoft\IME\15.0\IMETC" -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKCU:\Software\Microsoft\IME\15.0\IMETC" -Name "DefaultMode" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        New-Item -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer" -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer" -Name "EnableAutoTray" -Value 0 -Type DWord -Force -ErrorAction SilentlyContinue

        New-Item -Path "HKCU:\Software\ImeModePersistence" -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKCU:\Software\ImeModePersistence" -Name "ShowCaretIndicator" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKCU:\Software\ImeModePersistence" -Name "PersistMode" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
        Set-ItemProperty -Path "HKCU:\Software\ImeModePersistence" -Name "UiLanguage" -Value 2 -Type DWord -Force -ErrorAction SilentlyContinue

        $notifyPath = "HKCU:\Control Panel\NotifyIconSettings"
        if (Test-Path $notifyPath) {
          Get-ChildItem $notifyPath | ForEach-Object {
            Set-ItemProperty -Path $_.PSPath -Name "IsPromoted" -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          }
        }

    - name: Install a native ARM64 ffmpeg
      shell: pwsh
      run: |
        # imageio-ffmpeg only bundles/resolves x64 and other common-platform
        # binaries; on Windows ARM64 get_ffmpeg_exe() returns a path with
        # nothing there, so the capture script's fallback to a plain "ffmpeg"
        # on PATH needs a real one present. BtbN/FFmpeg-Builds publishes a
        # winarm64 static build.
        $ProgressPreference = 'SilentlyContinue'
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-winarm64-gpl.zip" -OutFile ffmpeg-arm64.zip
        Expand-Archive -Path ffmpeg-arm64.zip -DestinationPath ffmpeg-arm64 -Force
        $binDir = Get-ChildItem -Path ffmpeg-arm64 -Filter bin -Recurse -Directory | Select-Object -First 1 -ExpandProperty FullName
        Write-Host "ffmpeg bin dir: $binDir"
        Add-Content -Path $env:GITHUB_PATH -Value $binDir
        & "$binDir\ffmpeg.exe" -version

    - name: Install Python test dependencies
      shell: pwsh
      run: |
        python --version
        pip install pytest==8.3.4 pywinauto==0.6.9 pillow==10.4.0 imageio-ffmpeg==0.5.1 pydirectinput==1.0.4

    - name: Dismiss the Shell_OOBEProxy onboarding screen(s) (safety net)
      shell: pwsh
      run: |
        # A later page of the same onboarding flow (e.g. a Microsoft-account
        # sign-in nag) can appear after the IME install and other steps touch
        # the profile. Same script, short timeout since it should be a no-op
        # if the earlier pass already cleared everything.
        .\tests\ui\dismiss_onboarding_screens.ps1 -TimeoutSeconds 30

    - name: 'Diagnose desktop state: right before capture'
      shell: pwsh
      run: |
        mkdir diag -Force | Out-Null
        .\tests\ui\diag_desktop_state.ps1 -OutPrefix "diag/before-capture"

    - name: Keep the WSL installer window off the desktop
      shell: pwsh
      run: |
        # Root cause, finally evidenced rather than guessed: this image has no
        # WSL package at all -- `wsl --update` prints "The Windows Subsystem
        # for Linux is not installed" and exits 1. What fires every 30 seconds
        # is the runner's own provisioning daemon probing wsl (provjobd.exe <-
        # hosted-compute-agent, per the event watcher's parent chains), and the
        # system32 stub answers every probe by launching the interactive
        # installer -- `wsl.exe --update --confirm --prompt-before-exit` --
        # whose Terminal window waits for a keypress and steals the foreground.
        #
        # Two levers, whose effects the spawn watcher can tell apart:
        #
        # 1. The AllowWSL=0 policy, which documented enterprise controls say
        #    makes wsl.exe refuse to run. If it works here, the watcher shows
        #    zero installer spawns. Cheap, but unverified on the inbox stub --
        #    treated as an experiment, not the fix.
        New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WSL' -Force | Out-Null
        Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WSL' -Name 'AllowWSL' -Value 0 -Type DWord -Force
        Write-Host 'AllowWSL=0 policy set'

        # 2. A reaper that needs no theory: kill any wsl.exe within 200 ms of
        #    it appearing. The installer's Terminal window closes when the
        #    wsl.exe it hosts dies, so the foreground is stolen for at most a
        #    fraction of a second twice a minute -- inside what press_enter's
        #    verify-and-retry already tolerates. Deliberately NOT touching
        #    WindowsTerminal.exe by name: killing terminals by class is the
        #    mistake that once shut down the x64 runner, and on this image the
        #    agent console is ConsoleWindowClass, but the caution stands.
        $reaper = @'
        while ($true) {
          Get-Process wsl -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Milliseconds 200
        }
        '@
        $enc = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($reaper))
        Start-Process pwsh -ArgumentList '-NoProfile', '-WindowStyle', 'Hidden', '-EncodedCommand', $enc -WindowStyle Hidden
        Write-Host 'wsl reaper started (200 ms)'

        # Clear whatever is already on screen; the watcher records any return.
        Get-Process wsl, wslhost, WindowsTerminal -ErrorAction SilentlyContinue | ForEach-Object {
          Write-Host "killing $($_.ProcessName) ($($_.Id))"
          Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
        }

    - name: Start the wsl.exe spawn watcher
      shell: pwsh
      run: |
        # A Windows Terminal running C:\Windows\system32\wsl.exe keeps
        # reappearing during the capture -- six distinct windows in one run --
        # and closing them only makes room for the next. The before/after
        # desktop snapshots say a window existed, never who started it.
        #
        # Detached so it keeps running through the capture step; the runner
        # reaps it at job end. Read-only, so it cannot be the reason a window
        # appears or disappears.
        Start-Process pwsh -ArgumentList @(
          '-NoProfile', '-File', 'tests\ui\watch_wsl_spawns.ps1',
          '-OutFile', 'diag/wsl-watch.log', '-DurationSeconds', '900'
        ) -WindowStyle Hidden
        Start-Sleep -Seconds 2
        Write-Host 'watcher started'

    - name: Capture continuous IME persistence recording
      shell: pwsh
      env:
        PYTHONIOENCODING: utf-8
      run: |
        python tests/ui/capture_ime_recording.py "build-arm64/Release/ImeModePersistence.exe" ime-recording-arm64

    - name: 'Diagnose desktop state: right after capture'
      if: always()
      shell: pwsh
      run: |
        # The pre-capture snapshot alone could not answer what interfered
        # during a run -- comparing before and after is what identified the
        # stray WSL terminal, so capture both from now on.
        .\tests\ui\diag_desktop_state.ps1 -OutPrefix "diag/after-capture"

    - name: Run real-IME E2E tests
      shell: pwsh
      env:
        IME_PERSISTENCE_EXE: build-arm64/Release/ImeModePersistence.exe
      run: python -m pytest tests/ui/test_ime_persistence_e2e.py -v --tb=short

    - name: Upload recording artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: ime-recording-arm64
        path: ime-recording-arm64/ime-recording.mp4
        if-no-files-found: warn

    - name: Upload desktop-state diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: desktop-diagnostics-arm64
        path: diag/
        if-no-files-found: warn
